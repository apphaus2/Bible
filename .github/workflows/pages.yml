# Build the Bible Manga website from volumes/ and deploy it twice: to GitHub Pages (apphaus2.github.io/Bible) and to
# Cloudflare as the Worker "bible" (wrangler.jsonc: static assets from _site/, custom domain bible.apphaus.us).
# Repo settings needed once: Settings › Pages › Source: "GitHub Actions" (no custom domain there), and the Actions
# secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the Cloudflare step is skipped.
name: Build and deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Pillow, pypdf and Playwright (Chromium)
        run: |
          pip install pillow pypdf
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Check the full edition against the ASV
        run: |
          for v in tools/full/*/__init__.py; do
            python3 tools/full/build_volume.py "$(basename "$(dirname "$v")")" --check
          done

      - name: Restore thumbnail cache
        uses: actions/cache@v4
        with:
          path: _site/thumbs
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-

      - name: Restore the ASV PDF
        uses: actions/cache@v4
        with:
          path: |
            _book/bible-asv.pdf
            _book/asv
          key: asv-pdf-${{ hashFiles('ref/asv/*.usfm', 'tools/book/asv_pdf.py', 'tools/book/render.js') }}

      - name: Build the ASV PDF and its per-book PDFs (only when the text or its script changed)
        run: |
          test -f _book/bible-asv.pdf || python3 tools/book/asv_pdf.py
          test -f _book/asv/index.json || python3 tools/book/asv_pdf.py --split-only

      - name: Restore the downloads cache
        uses: actions/cache@v4
        with:
          path: _book/download
          key: downloads-${{ github.run_id }}
          restore-keys: downloads-

      - name: Build the downloads (each book as an EPUB and a PDF; only books whose pages changed)
        run: python3 tools/book/downloads.py

      - name: Build the site
        run: python3 tools/site/rebuild_site.py --thumbs --out _site

      - name: Deploy to Cloudflare (bible.apphaus.us)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Leave the downloads off GitHub Pages (its 1 GB site limit; bible.apphaus.us serves them)
        run: rm -rf _site/download

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
